<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Video & Audio Enhancer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/utilities.css">
    <link rel="stylesheet" href="styles/toggle.css">
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="logo">
          <span class="logo-icon"></span>
          <h1>Enhancer</h1>
        </div>
        <div class="header-controls">
          <button id="settingsToggle" class="icon-button" aria-label="Toggle settings">
            <i class="fas fa-cog"></i>
          </button>
          <button id="themeToggle" class="icon-button" aria-label="Toggle theme">
            <i class="fas fa-sun light-icon"></i>
            <i class="fas fa-moon dark-icon"></i>
          </button>
        </div>
      </header>
      
      <main class="app-main">
        <div id="settingsPanel" class="settings-panel">
          <div class="settings-header">
            <h3>Settings</h3>
            <button id="closeSettings" class="icon-button" aria-label="Close settings">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="settings-content">
            <div class="settings-group">
              <h4>Video Quality</h4>
              <div class="setting-control">
                <label for="videoQuality">Resolution Enhancement (px)</label>
                <input type="number" id="videoQuality" min="480" max="4096" step="1" value="1080" class="quality-input">
              </div>
            </div>
            <div class="settings-group">
              <h4>Audio Quality</h4>
              <div class="setting-control">
                <label for="audioQuality">Sample Rate (Hz)</label>
                <input type="number" id="audioQuality" min="8000" max="192000" step="100" value="48000" class="quality-input">
              </div>
            </div>
          </div>
        </div>

        <section class="status-container">
          <div class="status-indicator">
            <div class="status-ring">
              <div class="status-circle" id="statusCircle"></div>
            </div>
            <div class="status-text">
              <h2 id="statusText">Enhancement Active</h2>
              <p id="statusDetails">Optimizing video & audio</p>
            </div>
          </div>
        </section>
        
        <section class="enhancement-controls">
          <div class="control-group">
            <div class="control">
              <div class="control__track">
                <input type="radio" name="enhancement" id="audio" checked>
                <label for="audio">Audio</label>
                <input type="radio" name="enhancement" id="video">
                <label for="video">Video</label>
                <div class="indicator"></div>
              </div>
            </div>
          </div>
        </section>
        
        <section class="platform-selector">
          <h3>Optimize for:</h3>
          <div class="platform-buttons">
            <button class="platform-button active" data-platform="zoom">Zoom</button>
            <button class="platform-button" data-platform="meet">Google Meet</button>
            <button class="platform-button" data-platform="twitch">Twitch</button>
            <button class="platform-button" data-platform="custom">Custom</button>
          </div>
        </section>
      </main>
    </div>
    
    <script type="module" src="js/main.js"></script>
  </body>
</html>
